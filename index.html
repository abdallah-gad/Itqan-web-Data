<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETQAN + ROSA | نظام توزيع الأجهزة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0b3d91;
  --secondary: #c2185b;
  --bg-dark: #0f172a; 
  --bg-card: rgba(30, 41, 59, 0.7); 
  --text-light: #f8fafc;
  --text-muted: #94a3b8;
  --border-glow: rgba(255, 255, 255, 0.1);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
body { 
  background-color: var(--bg-dark);
  background-image: radial-gradient(circle at 15% 50%, rgba(11, 61, 145, 0.15), transparent 25%),
                    radial-gradient(circle at 85% 30%, rgba(194, 24, 91, 0.15), transparent 25%);
  color: var(--text-light); 
  padding: 20px; 
  min-height: 100vh; 
}
.container { max-width: 1400px; margin: auto; }

/* الهيدر */
.main-header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-card); backdrop-filter: blur(16px);
  padding: 15px 30px; border-radius: 20px;
  box-shadow: var(--shadow); margin-bottom: 30px;
  border: 1px solid var(--border-glow);
  border-top: 4px solid var(--secondary);
}

.logo-area { display: flex; align-items: center; gap: 20px; }

/* تنسيق اللوجو */
.logo-img { 
  height: 70px; 
  object-fit: contain; 
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); 
}

.header-text h1 { font-size: 24px; color: #fff; font-weight: 900; letter-spacing: 1px;}
.header-text p { font-size: 12px; color: var(--secondary); font-weight: 700; letter-spacing: 2px; margin-top: 4px;}

.date-badge { background: rgba(255,255,255,0.1); color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 700; font-size: 14px; border: 1px solid var(--border-glow); white-space: nowrap;}

/* إحصائيات */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat { 
  background: var(--bg-card); backdrop-filter: blur(10px);
  padding: 25px; border-radius: 16px; box-shadow: var(--shadow); 
  display: flex; align-items: center; gap: 15px; border-right: 4px solid var(--primary);
  border: 1px solid var(--border-glow);
  transition: transform 0.3s ease;
}
.stat:hover { transform: translateY(-5px); border-color: var(--primary); }
.stat-icon { font-size: 32px; }
.stat-info span { display: block; font-size: 30px; font-weight: 900; color: #fff; line-height: 1; }
.stat-info label { font-size: 14px; color: var(--text-muted); margin-top: 6px; display: block; font-weight: 600;}

/* أدوات البحث */
.toolbar { 
  display: flex; gap: 15px; flex-wrap: wrap; 
  background: var(--bg-card); backdrop-filter: blur(10px); 
  padding: 20px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 30px; align-items: center;
  border: 1px solid var(--border-glow);
}
.search-box { position: relative; flex: 2; min-width: 250px; }
.search-box .search-icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px;}
.search-box input { width: 100%; padding: 15px 45px 15px 20px; border: 1px solid var(--border-glow); border-radius: 12px; font-family: 'Cairo'; font-size: 15px; background: rgba(15, 23, 42, 0.6); color: #fff; transition: all 0.3s; }
.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(11,61,145,0.3); }

.toolbar select { padding: 15px 20px; border: 1px solid var(--border-glow); border-radius: 12px; font-family: 'Cairo'; font-size: 15px; font-weight: 600; background: rgba(15, 23, 42, 0.6); color: #fff; flex: 1; min-width: 140px; cursor: pointer; transition: all 0.3s; }
.toolbar select:focus { outline: none; border-color: var(--primary); }
.toolbar select option { background: var(--bg-dark); color: #fff; }

.btn-print { padding: 15px 25px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #1a237e); color: #fff; cursor: pointer; font-family: 'Cairo'; font-weight: 700; font-size: 15px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(11,61,145,0.4); white-space: nowrap;}
.btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(11,61,145,0.6);}

/* شبكة الأجهزة */
.devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; align-items: stretch; }

.card { 
  background: var(--bg-card); backdrop-filter: blur(10px);
  border-radius: 20px; padding: 25px; 
  box-shadow: var(--shadow); cursor: pointer; 
  transition: all 0.3s ease; border: 1px solid var(--border-glow); 
  position: relative; overflow: hidden; 
  display: flex; flex-direction: column; 
  text-decoration: none; color: inherit;
  animation: fadeIn 0.5s ease-out forwards; opacity: 0;
  height: 100%; 
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card:hover { 
  transform: translateY(-8px); 
  box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
  border-color: rgba(255,255,255,0.3);
  background: rgba(30, 41, 59, 0.9);
}

.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.badge { background: rgba(194, 24, 91, 0.2); color: #ff4081; padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; border: 1px solid rgba(194, 24, 91, 0.3);}
.branch-tag { background: rgba(11, 61, 145, 0.3); color: #64b5f6; padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; border: 1px solid rgba(11, 61, 145, 0.5);}
.card h3 { font-size: 20px; color: #fff; margin-bottom: 20px; border-bottom: 1px solid var(--border-glow); padding-bottom: 15px; font-weight: 900; min-height: 60px;}

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; flex-grow: 1; }
.info-item { font-size: 14px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px;}
.info-item span { color: #fff; font-weight: 800; }
.info-item.full-width { grid-column: 1 / -1; }

.empty { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted); font-size: 18px; font-weight: 700; }

/* التجاوب مع الشاشات */
@media (max-width: 992px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .search-box { flex: 1 1 100%; }
  .toolbar select { flex: 1 1 calc(50% - 10px); }
  .btn-print { flex: 1 1 100%; }
}

@media (max-width: 768px) {
  body { padding: 10px; }
  .main-header { flex-direction: column; text-align: center; gap: 15px; padding: 20px; }
  .logo-area { flex-direction: column; gap: 10px; }
  .logo-img { height: 60px; }
  .header-text h1 { font-size: 20px; }
  .date-badge { font-size: 12px; padding: 8px 15px; }
  .stats { grid-template-columns: 1fr; gap: 15px; }
  .toolbar select { flex: 1 1 100%; }
  .devices { grid-template-columns: 1fr; }
  .card { padding: 20px; }
  .card h3 { font-size: 18px; }
  .stat-info span { font-size: 24px; }
}

@media print {
  body { background: #fff; color: #000; }
  .main-header, .toolbar, .stats, .btn-print { display: none !important; }
  .devices { grid-template-columns: repeat(3, 1fr); gap: 15px; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; background: #fff; color: #000; }
  .card h3, .info-item span { color: #000; }
  .card:hover { transform: none; }
}
</style>
</head>
<body>
<div class="container">
  <header class="main-header">
    <div class="logo-area">
      <!-- اللوجو هنا، تأكد إن الصورة مرفوعة في نفس الفولدر -->
      <img src="logo.png" alt="ETQAN + ROSA" class="logo-img" onerror="this.style.display='none';">
      <div class="header-text">
        <h1>نظام توزيع الأجهزة</h1>
        <p>PRECISE MAINTENANCE, SUPERIOR CARE</p>
      </div>
    </div>
    <div class="date-badge" id="currentDate"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="ابحث برقم الكود (ID)، الاسم، أو الموديل..." oninput="applyFilter()">
    </div>
    <select id="filterBranch" onchange="applyFilter()"><option value="">كل الفروع</option></select>
    <select id="filterModel" onchange="applyFilter()"><option value="">كل الموديلات</option></select>
    <select id="filterPower" onchange="applyFilter()"><option value="">كل القوى</option></select>
    <button class="btn-print" onclick="window.print()"><span>🖨️</span> طباعة</button>
  </div>

  <div class="devices" id="devices"></div>
</div>

<script src="data.js"></script>
<script>
const options = { year: 'numeric', month: 'long', day: 'numeric' };
document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-EG', options);

function renderStats() {
  const branches = [...new Set(devices.map(d => d.branch))];
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-icon">🖥️</div><div class="stat-info"><span>${devices.length}</span><label>إجمالي الأجهزة</label></div></div>
    <div class="stat"><div class="stat-icon">🏢</div><div class="stat-info"><span>${branches.length}</span><label>الفروع</label></div></div>
    <div class="stat"><div class="stat-icon">⚙️</div><div class="stat-info"><span>${devices.filter(d => d.type.includes('2')).length}</span><label>2 هيد</label></div></div>
    <div class="stat"><div class="stat-icon">🔧</div><div class="stat-info"><span>${devices.filter(d => d.type.includes('4')).length}</span><label>4 هيد</label></div></div>
  `;
}

function fillFilters() {
  const branches = [...new Set(devices.map(d => d.branch).filter(Boolean))].sort();
  const models = [...new Set(devices.map(d => d.model).filter(Boolean))].sort();
  const powers = [...new Set(devices.map(d => d.type).filter(Boolean))].sort();
  document.getElementById('filterBranch').innerHTML += branches.map(b => `<option value="${b}">${b}</option>`).join('');
  document.getElementById('filterModel').innerHTML += models.map(m => `<option value="${m}">${m}</option>`).join('');
  document.getElementById('filterPower').innerHTML += powers.map(p => `<option value="${p}">${p}</option>`).join('');
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const branch = document.getElementById('filterBranch').value;
  const model = document.getElementById('filterModel').value;
  const power = document.getElementById('filterPower').value;

  const filtered = devices.filter(d => {
    if (branch && d.branch !== branch) return false;
    if (model && d.model !== model) return false;
    if (power && d.type !== power) return false;
    if (q) {
      const hay = `${d.id} ${d.name} ${d.type} ${d.model} ${d.branch} ${d.partition}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderDevices(filtered);
}

function renderDevices(list) {
  const container = document.getElementById('devices');
  container.innerHTML = '';
  if (list.length === 0) { container.innerHTML = '<div class="empty">لا توجد أجهزة مطابقة لبحثك 🔍</div>'; return; }

  list.forEach((dev, index) => {
    const card = document.createElement('a');
    card.className = 'card';
    card.style.animationDelay = `${index * 0.05}s`;
    card.href = `device.html?id=${dev.id}`; 
    
    card.innerHTML = `
      <div class="card-head">
        <span class="badge">ID: ${dev.id}</span>
        <span class="branch-tag">${dev.branch || 'غير محدد'}</span>
      </div>
      <h3>${dev.name}</h3>
      <div class="info-grid">
        <div class="info-item">⚡ <b>القوة:</b> <span>${dev.type}</span></div>
        <div class="info-item">⚙️ <b>الموديل:</b> <span>${dev.model}</span></div>
        <div class="info-item full-width">🧩 <b>البرتشن:</b> <span>${dev.partition}</span></div>
      </div>
    `;
    container.appendChild(card);
  });
}

renderStats();
fillFilters();
renderDevices(devices);
</script>
</body>
</html>
