<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات الجهاز | ETQAN + ROSA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0b3d91;
  --secondary: #c2185b;
  --bg-gradient: linear-gradient(135deg, #0b3d91 0%, #1a237e 100%);
  --card-bg: #ffffff;
  --text-main: #2c3e50;
  --text-muted: #6c7a89;
  --border-color: #e1e8ed;
}

* { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
body { 
  background: var(--bg-gradient); 
  color: var(--text-main); 
  padding: 20px; 
  min-height: 100vh; 
  display: flex; justify-content: center; align-items: center; 
}

.device-card {
  background: var(--card-bg); border-radius: 30px; 
  width: 100%; max-width: 450px; overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.3);
  animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

/* الجزء العلوي من الكارنيه */
.card-header {
  background: linear-gradient(135deg, var(--primary), #1a237e);
  padding: 30px 20px; text-align: center; position: relative;
}
.card-header::after {
  content: ''; position: absolute; bottom: -20px; left: 0; width: 100%; height: 40px;
  background: var(--card-bg); border-radius: 50% 50% 0 0;
}
.logo-text { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: 2px; margin-bottom: 5px;}
.logo-text span { color: var(--secondary); }
.logo-sub { font-size: 10px; color: rgba(255,255,255,0.7); letter-spacing: 1px; font-weight: 600;}

/* شارة الرقم */
.id-badge {
  background: var(--secondary); color: #fff;
  width: 60px; height: 60px; border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  font-size: 20px; font-weight: 900; position: absolute;
  bottom: -30px; left: 50%; transform: translateX(-50%);
  box-shadow: 0 10px 20px rgba(194, 24, 91, 0.4); z-index: 2;
}

/* جسم الكارنيه */
.card-body { padding: 40px 30px 30px; text-align: center; }
.device-name { font-size: 26px; font-weight: 900; color: var(--text-main); margin-bottom: 25px; }

/* شبكة البيانات */
.data-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
.data-row { 
  display: flex; justify-content: space-between; align-items: center; 
  background: #f8f9fa; padding: 15px 20px; border-radius: 14px; 
  border: 1px solid var(--border-color); transition: .3s;
}
.data-row:hover { background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-color: var(--primary); }
.data-label { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-weight: 700; font-size: 15px; }
.data-label i { font-style: normal; font-size: 18px; }
.data-value { color: var(--primary); font-weight: 900; font-size: 16px; background: #e8f0fe; padding: 4px 12px; border-radius: 8px; }

/* زرار الرجوع */
.btn-back {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 16px; border-radius: 14px;
  background: var(--primary); color: #fff; text-decoration: none;
  font-weight: 800; font-size: 16px; transition: .3s;
  box-shadow: 0 8px 20px rgba(11,61,145,0.2);
}
.btn-back:hover { background: #082c6b; transform: translateY(-2px); box-shadow: 0 12px 25px rgba(11,61,145,0.3); }

/* حالة الخطأ */
.error-state { padding: 40px; text-align: center; }
.error-state h2 { color: #d32f2f; font-size: 22px; margin-bottom: 10px; }
.error-state p { color: var(--text-muted); font-weight: 600; }
</style>
</head>
<body>

<div class="device-card" id="app"></div>

<script src="data.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const deviceId = urlParams.get('id');
const app = document.getElementById('app');

if (!deviceId) {
  app.innerHTML = `<div class="error-state"><h2>⚠️ لم يتم تحديد جهاز!</h2><p>الرجاء مسح QR Code صالح.</p></div>`;
} else {
  const dev = devices.find(d => d.id == deviceId);

  if (!dev) {
    app.innerHTML = `<div class="error-state"><h2>❌ الجهاز غير موجود!</h2><p>تأكد من أن رقم الجهاز صحيح.</p></div>`;
  } else {
    app.innerHTML = `
      <div class="card-header">
        <div class="logo-text">ETQAN <span>+</span> ROSA</div>
        <div class="logo-sub">PRECISE MAINTENANCE, SUPERIOR CARE</div>
        <div class="id-badge">#${dev.id}</div>
      </div>
      <div class="card-body">
        <h1 class="device-name">${dev.name}</h1>
        
        <div class="data-grid">
          <div class="data-row">
            <div class="data-label"><i>⚡</i> القوة</div>
            <div class="data-value">${dev.type}</div>
          </div>
          <div class="data-row">
            <div class="data-label"><i>⚙️</i> الموديل</div>
            <div class="data-value">${dev.model}</div>
          </div>
          <div class="data-row">
            <div class="data-label"><i>🏢</i> الفرع</div>
            <div class="data-value">${dev.branch}</div>
          </div>
          <div class="data-row">
            <div class="data-label"><i>🧩</i> البرتشن</div>
            <div class="data-value">${dev.partition}</div>
          </div>
        </div>

        <a href="index.html" class="btn-back">← العودة للصفحة الرئيسية</a>
      </div>
    `;
  }
}
</script>
</body>
</html>
