<style>
:root {
  --primary: #0b3d91;
  --secondary: #c2185b;
  --bg-color: #f4f7f6;
  --card-bg: #ffffff;
  --text-main: #2c3e50;
  --text-muted: #7f8c8d;
  --border-color: #e0e6ed;
}
* { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
.container { max-width: 1400px; margin: auto; }

/* الهيدر */
.main-header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--card-bg); padding: 15px 25px; border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,.05); margin-bottom: 25px;
  border-top: 4px solid var(--secondary);
}
.logo-area { display: flex; align-items: center; gap: 20px; }
.header-text h1 { font-size: 22px; color: var(--primary); font-weight: 700; }
.header-text p { font-size: 12px; color: var(--secondary); font-weight: 600; letter-spacing: 1px; }
.date-badge { background: #e8f0fe; color: var(--primary); padding: 8px 16px; border-radius: 30px; font-weight: 600; font-size: 14px; }

/* إحصائيات */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
.stat { background: var(--card-bg); padding: 20px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.04); display: flex; align-items: center; gap: 15px; border-right: 4px solid var(--primary); }
.stat-icon { font-size: 28px; }
.stat-info span { display: block; font-size: 26px; font-weight: 900; color: var(--primary); line-height: 1; }
.stat-info label { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: block; }

/* أدوات */
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; background: var(--card-bg); padding: 15px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.04); margin-bottom: 25px; align-items: center; }
.search-box { position: relative; flex: 2; min-width: 250px; }
.search-box .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #999; }
.search-box input { width: 100%; padding: 12px 40px 12px 15px; border: 1px solid var(--border-color); border-radius: 10px; font-family: 'Cairo'; font-size: 14px; background: #f9fbfd; }
.search-box input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(11,61,145,.1); }
.toolbar select { padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 10px; font-family: 'Cairo'; font-size: 14px; background: #f9fbfd; flex: 1; min-width: 140px; cursor: pointer; }
.toolbar select:focus { outline: none; border-color: var(--primary); }
.btn-print { padding: 12px 20px; border: none; border-radius: 10px; background: var(--primary); color: #fff; cursor: pointer; font-family: 'Cairo'; font-weight: 700; font-size: 14px; transition: .3s; display: flex; align-items: center; gap: 8px; }
.btn-print:hover { background: #082c6b; transform: translateY(-2px); }

/* شبكة الأجهزة */
.devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; align-items: start; }
.card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.04); cursor: pointer; transition: .3s; border: 1px solid var(--border-color); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(11,61,145,.15); border-color: var(--primary); }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.badge { background: var(--primary); color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.branch-tag { background: #fce4ec; color: var(--secondary); padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; }
.card h3 { font-size: 18px; color: var(--text-main); margin-bottom: 15px; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; font-weight: 700;}
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.info-item { font-size: 13px; color: var(--text-muted); }
.info-item b { color: var(--text-main); font-weight: 600; }
.info-item.full-width { grid-column: 1 / -1; }
.info-item span { color: var(--secondary); font-weight: 700; }
.qr-mini { display: flex; justify-content: center; align-items: center; background: #fafbfc; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; margin-top: auto; min-height: 100px; }
.qr-mini canvas { max-width: 100%; height: auto; }
.empty { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted); font-size: 16px; font-weight: 600; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
.modal.active { display: flex; }
.modal-content { background: var(--card-bg); border-radius: 20px; padding: 30px; max-width: 450px; width: 100%; position: relative; text-align: center; animation: pop .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-top: 5px solid var(--secondary); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-close { position: absolute; top: 15px; left: 15px; background: #f0f0f0; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; font-weight: bold; color: #555; transition: .2s; }
.modal-close:hover { background: var(--secondary); color: #fff; }
.modal-content h2 { margin: 15px 0; color: var(--primary); font-size: 22px; font-weight: 800; }
.modal-info { text-align: right; background: #f8f9fa; padding: 15px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; border: 1px solid var(--border-color); }
.modal-info div { margin: 6px 0; color: var(--text-muted); }
.modal-info b { color: var(--text-main); }
.qr-large { display: flex; justify-content: center; padding: 20px; background: #fff; border: 2px dashed var(--border-color); border-radius: 12px; margin-bottom: 20px; min-height: 290px; align-items: center; }
.modal-actions { display: flex; justify-content: center; }

/* Print */
@media print {
  body { background: #fff; padding: 0; }
  .main-header, .toolbar, .stats, .modal, .btn-print { display: none !important; }
  .devices { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
  .card:hover { transform: none; box-shadow: none; }
  .qr-mini { border: none; }
}
</style>

  const branches = [...new Set(devices.map(d => d.branch))].sort();
  const models = [...new Set(devices.map(d => d.model).filter(Boolean))].sort();
  const powers = [...new Set(devices.map(d => d.type).filter(Boolean))].sort();
  document.getElementById('filterBranch').innerHTML += branches.map(b => `<option value="${b}">${b}</option>`).join('');
  document.getElementById('filterModel').innerHTML += models.map(m => `<option value="${m}">${m}</option>`).join('');
  document.getElementById('filterPower').innerHTML += powers.map(p => `<option value="${p}">${p}</option>`).join('');
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const branch = document.getElementById('filterBranch').value;
  const model = document.getElementById('filterModel').value;
  const power = document.getElementById('filterPower').value;

  const filtered = devices.filter(d => {
    if (branch && d.branch !== branch) return false;
    if (model && d.model !== model) return false;
    if (power && d.type !== power) return false;
    if (q) {
      const hay = `${d.id} ${d.name} ${d.type} ${d.model} ${d.branch} ${d.partition}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderDevices(filtered);
}

function renderDevices(list) {
  const container = document.getElementById('devices');
  container.innerHTML = '';
  if (list.length === 0) { container.innerHTML = '<div class="empty">لا توجد أجهزة مطابقة لبحثك 🔍</div>'; return; }

  list.forEach(dev => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(dev);
    card.innerHTML = `
      <div class="card-head">
        <span class="badge">ID: ${dev.id}</span>
        <span class="branch-tag">${dev.branch}</span>
      </div>
      <h3>${dev.name}</h3>
      <div class="info-grid">
        <div class="info-item"><b>القوة:</b> <span>${dev.type}</span></div>
        <div class="info-item"><b>الموديل:</b> <span>${dev.model}</span></div>
        <div class="info-item full-width"><b>البرتشن:</b> <span>${dev.partition}</span></div>
      </div>
      <div class="qr-mini" id="qr-mini-${dev.id}"></div>
    `;
    container.appendChild(card);

    const qrLink = `${siteURL}?id=${dev.id}`;
    QRCode.toCanvas(qrLink, { width: 90, margin: 1, color: { dark: '#0b3d91', light: '#ffffff' } }, function (error, canvas) {
      if (!error) document.getElementById(`qr-mini-${dev.id}`).appendChild(canvas);
    });
  });
}

function openModal(dev) {
  currentDevice = dev;
  document.getElementById('modalTitle').textContent = `#${dev.id} - ${dev.name}`;
  document.getElementById('modalInfo').innerHTML = `
    <div><b>القوة:</b> ${dev.type}</div>
    <div><b>الموديل:</b> ${dev.model}</div>
    <div><b>الفرع:</b> ${dev.branch}</div>
    <div><b>البرتشن:</b> ${dev.partition}</div>
  `;
  const qrBox = document.getElementById('qrLarge');
  qrBox.innerHTML = '';
  const qrLink = `${siteURL}?id=${dev.id}`;
  QRCode.toCanvas(qrLink, { width: 250, margin: 2, color: { dark: '#0b3d91', light: '#ffffff' } }, function (error, canvas) {
    if (!error) qrBox.appendChild(canvas);
  });
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('modal').classList.remove('active');
  currentDevice = null;
}

function printSingle() {
  if (!currentDevice) return;
  const win = window.open('', '_blank');
  win.document.write(`
    <html dir="rtl"><head><title>QR - ${currentDevice.name}</title>
    <style>body{font-family:'Cairo', sans-serif;text-align:center;padding:40px;} .header{color:#0b3d91;font-size:18px;font-weight:bold;margin-bottom:20px;border-bottom:2px solid #c2185b;padding-bottom:10px} h1{font-size:24px;color:#333;margin:10px 0} .info{margin:8px 0;font-size:15px;color:#555} .qr{margin:20px auto;padding:15px;border:1px solid #ddd;display:inline-block;border-radius:10px} .footer{margin-top:20px;font-size:12px;color:#999}</style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"><\/script>
    </head><body>
    <div class="header">ETQAN + ROSA Maintenance Group</div>
    <h1>#${currentDevice.id} - ${currentDevice.name}</h1>
    <div class="info"><b>القوة:</b> ${currentDevice.type}</div>
    <div class="info"><b>الموديل:</b> ${currentDevice.model}</div>
    <div class="info"><b>الفرع:</b> ${currentDevice.branch}</div>
    <div class="info"><b>البرتشن:</b> ${currentDevice.partition}</div>
    <div class="qr" id="qr"></div>
    <div class="footer">PRECISE MAINTENANCE, SUPERIOR CARE</div>
    <script>
      setTimeout(()=>{
        QRCode.toCanvas(document.createElement('canvas'), \`${siteURL}?id=${currentDevice.id}\`, { width: 250, margin: 2 }, function (error, canvas) {
          if(!error) document.getElementById('qr').appendChild(canvas);
          window.print();
        });
      }, 300);
    <\/script>
    </body></html>
  `);
}

function checkUrlForDevice() {
  const deviceId = new URLSearchParams(window.location.search).get('id');
  if (deviceId) {
    const dev = devices.find(d => d.id == deviceId);
    if (dev) setTimeout(() => openModal(dev), 500);
  }
}

renderStats();
fillFilters();
renderDevices(devices);
checkUrlForDevice();
</script>
</body>
</html>
